<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — 页面不存在 | MoteDB</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/favicon.png">
<style>
  :root{--bg:#0a0f16;--txt:#e8eef5;--dim:#93a3b8;--faint:#5d6f85;--orange:#ff8a2b;--orange2:#ffb066;--line:#1b2739;--line2:#253449;
    --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--txt);
    font-family:-apple-system,'PingFang SC','Microsoft YaHei','Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:24px;text-align:center}
  .grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(90,160,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(90,160,255,.045) 1px,transparent 1px);
    background-size:44px 44px;mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 20%,transparent 100%);-webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 20%,transparent 100%)}
  main{position:relative;z-index:1;max-width:560px}
  img{height:88px;filter:drop-shadow(0 0 28px rgba(120,170,255,.2))}
  .code{margin-top:28px;font-family:var(--mono);font-size:15px;color:var(--orange2);letter-spacing:2px}
  h1{margin-top:10px;font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.5px}
  h1 span{display:block;font-size:.6em;font-weight:600;color:var(--dim);margin-top:6px}
  p{margin-top:14px;color:var(--dim);font-size:15.5px;line-height:1.7}
  .links{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
  a{color:var(--txt);text-decoration:none;padding:11px 22px;border-radius:9px;border:1px solid var(--line2);font-weight:600;font-size:15px;transition:border-color .15s}
  a:hover{border-color:var(--orange)}
  a.primary{background:linear-gradient(135deg,var(--orange),#ff9d4d);color:#1a0d02;border-color:transparent;box-shadow:0 4px 24px rgba(255,138,43,.35)}
</style>
</head>
<body>
<div class="grid"></div>
<main>
  <img src="/logo-mark-dark.png" alt="MoteDB">
  <div class="code">HTTP 404</div>
  <h1>这个页面不存在<span>This page does not exist</span></h1>
  <p>链接可能已过期，或者官网结构调整过了。<br>The link may be stale, or the site has moved things around.</p>
  <div class="links">
    <a class="primary" href="/">返回首页</a>
    <a href="/en/">English</a>
    <a href="https://github.com/motedb/motedb/tree/main/docs">文档 · Docs</a>
    <a href="https://github.com/motedb/motedb">GitHub</a>
  </div>
</main>
</body>
</html>
